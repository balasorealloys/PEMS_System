# PEMS — host nginx vhost for energy.balasorealloys.in
# Fronts the PEMS frontend container (published on 127.0.0.1:4040), which serves the
# SPA and proxies /api to the backend internally — so this is a single proxy hop and
# the login cookie stays same-origin. Reuses the shared *.balasorealloys.in wildcard
# cert already on this host.
#
# Install (on bal-gpu, needs sudo):
#   sudo cp deploy/nginx/energy.balasorealloys.in.conf /etc/nginx/sites-enabled/energy.balasorealloys.in
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name energy.balasorealloys.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name energy.balasorealloys.in;

    ssl_certificate     /etc/ssl/certs/fullchain.crt;
    ssl_certificate_key /etc/ssl/private/private_decrypted.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 25m;

    location / {
        proxy_pass         http://127.0.0.1:4040;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
