services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: pems-backend
    container_name: pems-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8007        # internal only — reached by the frontend nginx over the
      PGSSLMODE: disable     # pems network (backend:8007); the new PG has no SSL
    # No host port published: the backend is not exposed on the host — only the
    # frontend (:4040) is. Keeps PEMS to a single host port on the shared server.
    expose:
      - "8007"
    networks:
      - pems

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: pems-frontend
    container_name: pems-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4040:4040"          # host port 4040 (verified free in the baldev-gpu registry)
    networks:
      - pems

networks:
  pems:
    driver: bridge
