# Serves the built SPA on :4040 and proxies /api to the backend container, so the
# browser sees a single origin (http://<host>:4040) and the "pems_session" cookie
# works with no CORS setup — same single-origin design as the built-in uvicorn
# static mount, just split across two containers/ports.
server {
    listen 4040;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8007/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    location / {
        try_files $uri /index.html;
    }
}
