# Serves the built SPA on :4040 and proxies /api to the backend container, so the
# browser sees a single origin and the "pems_session" cookie works with no CORS setup.
server {
    listen 4040;
    server_name _;
    server_tokens off;                 # don't leak the nginx version

    root /usr/share/nginx/html;
    index index.html;

    # --- security headers (always, so they're present on errors too) ---
    # HSTS: force HTTPS for 2 years (the public edge is TLS-terminated by the host nginx).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           "DENY"                                always;  # clickjacking
    add_header X-Content-Type-Options    "nosniff"                             always;  # MIME sniffing
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy        "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    # CSP: the app is fully self-hosted except Google Fonts. The one inline <script> (the
    # pre-paint theme guard in index.html) is allowed by its exact sha256 — NOT 'unsafe-inline'.
    # 'unsafe-inline' is only granted to styles (React inline styles / ECharts / Tailwind need it).
    # NB: if that inline theme script in index.html changes, recompute the hash below.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'sha256-2RCcCVi3TQN39KkIicVODvu5HxiXaz3rDrZaPyyxyUw='; connect-src 'self'" always;

    # --- block common scanner-probed paths so they return 404 instead of falling through
    # to the SPA's index.html (which returns 200 and trips naive "exposed path" scanners).
    # None of these actually exist here (no PHP, no Apache, no Spring Boot) — this is hygiene.
    location ~ /\.(?!well-known)        { return 404; }   # dotfiles: /.env, /.git/*, ...
    location ~* \.php$                  { return 404; }   # no PHP in this stack
    location ~ ^/(server-status|server-info|actuator) { return 404; }

    location /api/ {
        proxy_pass http://backend:4040/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    location / {
        try_files $uri /index.html;
    }
}
